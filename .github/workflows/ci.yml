name: Story Block CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Check the whitespace of what this PR or push introduced; a bare `git diff --check`
      # on a fresh checkout compares a clean tree and never finds anything.
      - name: Diff check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE" HEAD
      - name: Syntax check
        run: npm run check
      # A pull request whose changed files are all inside the pack area runs only the pack
      # tests. Anything else (other files, a push to main, a manual run, no base to compare,
      # an empty list) runs the full suite. This stays one job so the "verify" check always
      # reports a result.
      - name: Choose the test set
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=full
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --no-renames "$BASE" HEAD)"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(examples/packs/|docs/v2/ERSVEIL\.md$|tests/v2/packs/)'; then
              scope=packs
            fi
          fi
          echo "Test set: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Pack tests (pack-only change)
        if: steps.scope.outputs.scope == 'packs'
        run: |
          # Tests outside tests/v2/packs also read the example packs and the pack test helpers.
          others="$(grep -rliE 'examples/packs|packs/helpers|ersveil' tests --include='*.test.js' | grep -v '^tests/v2/packs/' | sort)"
          echo "Also running the tests that read the example packs:"
          printf '%s\n' "$others"
          # shellcheck disable=SC2086
          node --test tests/v2/packs/*.test.js $others
      - name: Behavioral tests
        if: steps.scope.outputs.scope != 'packs'
        env:
          FUZZ_DUMP_DIR: ${{ runner.temp }}
        run: npm test
      - name: Keep state-fuzz replay dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-fuzz-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-fuzz-*/mismatch.json
          if-no-files-found: ignore
          retention-days: 7

  # The tests that need the other two repos beside this one skip when those are missing, so the
  # "verify" job never runs them. This job checks all three repos out side by side (Story_block,
  # Story_director, npc_state_delta; the two siblings at their default branch) and runs only those
  # tests, and fails if any of them skipped instead of ran.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Story_block
      - uses: actions/checkout@v4
        with:
          repository: kohz87/Story_director
          path: Story_director
      - uses: actions/checkout@v4
        with:
          repository: kohz87/npc_state_delta
          path: npc_state_delta
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cross-repo suite tests (a skip fails the job)
        working-directory: Story_block
        env:
          STORY_SUITE_ROOT: ${{ github.workspace }}
        run: |
          # The tests that look for Story_director / npc_state_delta (keep in step with CLAUDE.md "Known traps").
          files="
            tests/v2/lean-rpg/checks/suite.test.js
            tests/v2/packs/holidays-world.test.js
            tests/v2/packs/cast-presets.test.js
            tests/v2/integration/checks-flip.test.js
            tests/v2/data-modules/unused.test.js
          "
          for f in $files; do test -f "$f" || { echo "::error::missing suite test $f"; exit 1; }; done
          # shellcheck disable=SC2086
          node --test --test-reporter=tap $files | tee "$RUNNER_TEMP/suite.tap"
          status=${PIPESTATUS[0]}
          skipped="$(sed -n 's/^# skipped //p' "$RUNNER_TEMP/suite.tap" | tail -n 1)"
          echo "skipped suite tests: ${skipped:-unknown}"
          if [ "$skipped" != "0" ]; then
            echo "::error::suite tests skipped instead of running (siblings not found, or a test is skipped)"
            grep -E '# SKIP' "$RUNNER_TEMP/suite.tap" || true
            exit 1
          fi
          exit "$status"
