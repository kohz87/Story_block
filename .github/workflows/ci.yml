name: Story Block CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Check the whitespace of what this PR or push introduced; a bare `git diff --check`
      # on a fresh checkout compares a clean tree and never finds anything.
      - name: Diff check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE" HEAD
      - name: Syntax check
        run: npm run check
      # A pull request whose changed files are all inside the pack area runs only the pack
      # tests. Anything else (other files, a push to main, a manual run, no base to compare,
      # an empty list) runs the full suite. This stays one job so the "verify" check always
      # reports a result.
      - name: Choose the test set
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=full
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --no-renames "$BASE" HEAD)"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(examples/packs/|docs/v2/ERSVEIL\.md$|tests/v2/packs/)'; then
              scope=packs
            fi
          fi
          echo "Test set: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Pack tests (pack-only change)
        if: steps.scope.outputs.scope == 'packs'
        run: node --test tests/v2/packs/*.test.js
      - name: Behavioral tests
        if: steps.scope.outputs.scope != 'packs'
        env:
          FUZZ_DUMP_DIR: ${{ runner.temp }}
        run: npm test
      - name: Keep state-fuzz replay dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-fuzz-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-fuzz-*/mismatch.json
          if-no-files-found: ignore
          retention-days: 7
