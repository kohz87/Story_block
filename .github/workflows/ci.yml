name: Story Block CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Check the whitespace of what this PR or push introduced; a bare `git diff --check`
      # on a fresh checkout compares a clean tree and never finds anything.
      - name: Diff check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE" HEAD
      - name: Syntax check
        run: npm run check
      - name: Behavioral tests
        env:
          FUZZ_DUMP_DIR: ${{ runner.temp }}
        run: npm test
      - name: Keep state-fuzz replay dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-fuzz-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-fuzz-*/mismatch.json
          if-no-files-found: ignore
          retention-days: 7
